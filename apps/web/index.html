<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CollabCode — Collaborative IDE</title>
    <script>
      try {
        var ui = JSON.parse(localStorage.getItem("collabcode.ui") || "null");
        var theme = (ui && ui.state && ui.state.theme) || "dark";
        if (theme === "light") document.documentElement.classList.remove("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

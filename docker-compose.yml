services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collabcode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collabcode_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-collabcode}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collabcode} -d ${POSTGRES_DB:-collabcode}"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  # Optional app services — enable with: docker compose --profile full up --build
  api:
    profiles: ["full"]
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://collabcode:collabcode_dev_password@postgres:5432/collabcode?schema=public}
      PORT: "4000"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  collaboration:
    profiles: ["full"]
    build: { context: ., dockerfile: docker/collaboration.Dockerfile }
    environment: { PORT: "4001", HEALTH_PORT: "4003" }
    ports: ["4001:4001", "4003:4003"]
    depends_on:
      postgres: { condition: service_healthy }
  execution:
    profiles: ["full"]
    build: { context: ., dockerfile: docker/execution.Dockerfile }
    environment: { PORT: "4002" }
    ports: ["4002:4002"]
  web:
    profiles: ["full"]
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
